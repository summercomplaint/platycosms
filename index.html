<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten Platycosms</title>
<meta name="description" content="Interactive 3D gluing diagrams of the ten closed flat 3-manifolds, drawn from outside and from inside.">
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<button id="bTheme" class="theme" type="button" aria-label="Switch to light mode" title="Switch to light mode"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><g><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.6" y1="4.6" x2="6.4" y2="6.4"/><line x1="17.6" y1="17.6" x2="19.4" y2="19.4"/><line x1="4.6" y1="19.4" x2="6.4" y2="17.6"/><line x1="17.6" y1="6.4" x2="19.4" y2="4.6"/></g></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/><circle class="star" cx="17" cy="5" r="1"/><circle class="star" cx="20.5" cy="9" r="0.7"/></svg></button>
<div class="wrap">
  <header>
    <h1>The ten platycosms</h1>
    <div class="intro" id="intro"></div>
  </header>
  <nav id="tabs" role="tablist" aria-label="Platycosm"></nav>
  <main>
    <div class="stage" id="stageBox">
      <canvas id="cv" aria-label="3D diagram of the selected platycosm"></canvas>
      <button type="button" class="clear" id="aClear" hidden>Clear ghost</button>
      <div class="hint" id="hint" hidden><span>Drag to look · W A S D or arrow keys to move · Q / E down and up · scroll to zoom</span></div>
      <div class="tools">
        <div class="seg" role="group" aria-label="View">
          <button id="mOut" type="button" aria-pressed="true">Outside</button>
          <button id="mIn" type="button" aria-pressed="false">Inside</button>
        </div>
        <label><input type="checkbox" id="tCrab" checked> Crab</label>
        <span class="gap"></span>
        <div class="savewrap">
          <button id="bPng" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="pngPop">Save PNG</button>
          <div class="pop" id="pngPop" role="dialog" aria-label="Save PNG" hidden>
            <label><input type="checkbox" id="tTransp"> Transparent background</label>
            <button id="bSave" type="button">Save</button>
          </div>
        </div>
      </div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
  <footer>
    Math: J. H. Conway and J. P. Rossetti, <a href="https://arxiv.org/abs/math/0311476">Describing the platycosms</a>.
    Figure style: Greg Egan, <a href="https://www.gregegan.net/SCIENCE/Loops/Loops.html">Loops Across Space</a>.
    Crab: <a href="https://skfb.ly/6xDJv">“Fiddler Crab”</a> by renceed, <a href="http://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a>.
    <a href="https://github.com/summercomplaint/platycosms">Source and notes</a>.
  </footer>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
